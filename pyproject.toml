[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lid-trainer"
version = "0.1.0"
description = "Interactive trainer for the Leben in Deutschland / Einbürgerungstest question bank"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "flask>=3.0",
]

[project.scripts]
lid-trainer = "lid_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lid_trainer = ["data/*.json", "data/images/*.png"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
